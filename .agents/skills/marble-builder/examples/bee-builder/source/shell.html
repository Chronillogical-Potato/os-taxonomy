<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bee builder</title>
<style>
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:400 800;font-display:block;src:url(data:font/ttf;base64,__FONT__) format('truetype')}
:root{font-family:'Baloo 2';color:#261d13;background:#f4efe4;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button{font:500 18px 'Baloo 2';color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
main{position:relative;isolation:isolate;width:100%;height:100svh;min-height:600px;overflow:hidden;background:#f8f5eb}
header{position:absolute;z-index:3;left:32px;top:24px;max-width:calc(100% - 110px);pointer-events:none}
#experienceTitle{font-size:14px;font-weight:450;opacity:.65;margin-bottom:6px}
h1{font-size:21px;font-weight:500;letter-spacing:-.3px;margin:0;line-height:1.2}.progress{position:absolute;z-index:3;top:94px;left:32px;display:flex;gap:7px;align-items:center}.progress i{width:9px;height:9px;border:1.5px solid #695c47;border-radius:50%;background:transparent}.progress i.done{background:#59442b}.progress i.current{background:#f4aa25;box-shadow:0 0 0 4px #f4aa2525}
#explanation{position:absolute;z-index:3;top:24%;left:40px;width:min(28vw,390px);padding:18px 20px;border-left:4px solid #d5a33c;background:linear-gradient(90deg,#fdfcfaed,#fdfcfa00);pointer-events:none}
#instruction{font-weight:550;font-size:clamp(27px,2.45vw,36px);letter-spacing:-.5px;line-height:1.2;text-align:left;margin:0;text-wrap:pretty}
#world{position:absolute;inset:110px 0 115px;display:flex;align-items:center;justify-content:center}#scene{--scene-span:.5;width:min(100%,1050px,calc((100vw - 120px - min(56vw,780px)) / var(--scene-span)));height:100%;overflow:visible;touch-action:manipulation}
#controls{position:absolute;z-index:5;bottom:30px;left:24px;right:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
button.control{min-height:50px;border:2px solid #473522;border-radius:22px;padding:10px 18px;background:#fffcf6;box-shadow:0 4px 0 #d1c5af,inset 0 2px 0 #fff;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s,box-shadow .12s,background .12s}
button.control svg{width:24px;height:24px;flex-shrink:0}button.control:hover{background:#fff1cb;transform:translateY(-2px)}button.control:active{transform:translateY(4px);box-shadow:0 1px 0 #b99d70}button.control[aria-pressed=true]{background:#ffcf66;box-shadow:0 5px 0 #b88a3e,inset 0 2px 0 #ffe8a4}button.control.primary{background:#f42324;color:#fff;border-color:#8b0023;box-shadow:0 5px 0 #8b0023,inset 0 2px 0 #ffffff55}button.control.primary:hover{background:#dc171e}button.control:disabled{opacity:.4;cursor:default;transform:none}button:focus-visible{outline:4px solid #1d6475;outline-offset:6px}
#restart{position:absolute;z-index:5;right:24px;top:22px;width:44px;height:44px;min-height:44px;padding:8px;border:0;background:#ffffff80;box-shadow:none;border-radius:22px;display:flex;align-items:center;justify-content:center}#restart svg{width:23px;height:23px}#restart:hover{background:#fff8}
.room-focus{stroke:transparent;stroke-width:8;stroke-linejoin:round}.scene-tap{cursor:pointer;outline:none}.scene-tap:hover .room-focus{stroke:#4c735f}.scene-tap:focus-visible .room-focus{stroke:#1d6475;stroke-width:10;stroke-dasharray:10 5}.scene-tap:active .room-focus{stroke:#294c3c}.scene-tap:focus-visible .wall{stroke:#1d6475;stroke-width:5}.scene-tap:hover .wall{stroke:#4c735f;stroke-width:5}.scene-tap:active .wall{stroke:#294c3c;stroke-width:6}.wall{transition:stroke .15s,stroke-width .15s}.bee-float{animation:float 3s ease-in-out infinite}.draw-in{animation:appear .6s both}.chosenRing{stroke:#1d6475;stroke-dasharray:8 7;stroke-width:3;fill:none;animation:appear .25s both}
@keyframes float{50%{transform:translateY(-6px)}}@keyframes appear{from{opacity:0}to{opacity:1}}
@media(max-width:800px){header{left:20px;top:20px;max-width:calc(100% - 80px)}#experienceTitle{font-size:12px;margin-bottom:4px}h1{font-size:17px}.progress{top:79px;left:20px}#restart{right:12px;top:14px}#explanation{top:105px;left:20px;width:calc(100% - 40px);padding:0 0 0 14px;border-left-width:3px;background:transparent}#instruction{font-size:clamp(22px,5.9vw,28px);line-height:1.17;letter-spacing:-.3px}#world{inset:180px -30px 176px}#scene{width:min(100%,1050px)}#controls{bottom:22px;left:14px;right:14px;gap:8px}button.control{font-size:16px;padding:10px 13px;min-height:50px;border-radius:18px;gap:6px}button.control svg{width:23px;height:23px}#controls .primary{flex-basis:auto}main{min-height:650px}}
@media(max-height:700px) and (min-width:801px){header{top:14px}#experienceTitle{font-size:12px}h1{font-size:17px}.progress{top:75px}#explanation{top:24%;padding:10px 14px}#instruction{font-size:27px}#world{top:90px;bottom:105px}#controls{bottom:25px}main{min-height:560px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Opening cover is a question-led illustrated composition, before the lesson UI. */
#cover{position:absolute;inset:0;z-index:10;overflow:hidden;background:#f8f5eb}
#cover[hidden]{display:none}main[data-screen="cover"]{min-height:0}main[data-screen="cover"]>:not(#cover){display:none!important}
.cover-copy{position:absolute;z-index:2;left:7%;top:29%;width:43%;pointer-events:none}
#coverQuestion{font-size:clamp(52px,5.8vw,84px);font-weight:550;line-height:1.02;letter-spacing:-1.8px;text-wrap:balance;color:#253e38;margin:0;max-width:620px}
#coverStart{margin-top:32px;min-height:58px;padding:13px 23px;font-size:20px;pointer-events:auto}
#coverArt{position:absolute;right:-5%;top:0;width:65%;height:100%;overflow:visible;pointer-events:none}
@media(max-width:800px){.cover-copy{left:24px;right:24px;top:9%;width:auto}#coverQuestion{font-size:clamp(39px,10.8vw,60px);max-width:550px;line-height:1.04;letter-spacing:-1px}#coverArt{top:27%;right:-9%;width:118%;height:59%}#coverStart{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap;font-size:18px}#coverStart:hover{transform:translate(-50%,-2px)}#coverStart:active{transform:translate(-50%,4px)}}
@media(max-height:650px) and (min-width:801px){.cover-copy{top:23%}#coverQuestion{font-size:56px}#coverStart{margin-top:24px}}
</style>
</head>
<body>
<main aria-label="Bee builder activity" data-screen="cover">
<section id="cover" aria-labelledby="coverQuestion">
  <svg id="coverArt" viewBox="0 0 800 760" aria-hidden="true"></svg>
  <div class="cover-copy"><h1 id="coverQuestion">Why do bees use hexagons?</h1>
  <button id="coverStart" class="control primary" type="button"></button></div>
</section>
<header><div id="experienceTitle">Bee builder</div><h1 id="stageTitle">Rooms without gaps</h1></header>
<div class="progress" role="img" aria-label="Explore shapes, compare wax, make predictions, finish"><i></i><i></i><i></i><i></i></div>
<button id="restart" aria-label="Start again">↻</button>
<aside id="explanation"><p id="instruction" aria-live="polite"></p></aside>
<div id="world"><svg id="scene" viewBox="0 0 1000 650" role="group" aria-label="Honeycomb workshop"></svg></div>
<div id="controls" aria-label="Activity controls"></div>
</main>
<script>__VOCABULARY__
__APP__</script>
</body>
</html>
